<svg xmlns="http://www.w3.org/2000/svg" width="640" height="630" viewBox="0 0 640 630" role="img" aria-labelledby="title desc">
  <title id="title">One layout, multiple scenery packages</title>
  <desc id="desc">The division defines lighting locations and properties. BARS assigns object IDs. Contributors map the same objects into different scenery packages.</desc>
  <rect width="640" height="630" rx="18" fill="#111113"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="28" y="43" fill="#fafafa" font-size="25" font-weight="600">One layout, multiple scenery packages</text>
    <rect x="28" y="72" width="584" height="145" rx="12" fill="#232327" stroke="#52525b"/>
    <text x="50" y="108" fill="#fca5a5" font-size="18" font-weight="700">DIVISION</text>
    <text x="50" y="145" fill="#fafafa" font-size="25" font-weight="600">Shared airport lighting layout</text>
    <text x="50" y="183" fill="#d4d4d8" font-size="20">Locations, shapes, names, and lighting properties</text>
    <path d="M320 218 V254 m-8-8 8 8 8-8" fill="none" stroke="#a1a1aa" stroke-width="3"/>
    <rect x="130" y="262" width="380" height="113" rx="12" fill="#302023" stroke="#fb7185"/>
    <text x="155" y="301" fill="#fafafa" font-size="25" font-weight="600">BARS assigns object IDs</text>
    <text x="155" y="344" fill="#fecdd3" font-size="22">BARS_...   One ID per object</text>
    <path d="M320 376 V398 H170 V432 M320 398 H470 V432 m-8-8 8 8 8-8 M162 424 l8 8 8-8" fill="none" stroke="#a1a1aa" stroke-width="3"/>
    <rect x="28" y="440" width="280" height="127" rx="12" fill="#182b25" stroke="#4b8068"/>
    <rect x="332" y="440" width="280" height="127" rx="12" fill="#182b25" stroke="#4b8068"/>
    <text x="48" y="473" fill="#86efac" font-size="17" font-weight="700">CONTRIBUTOR</text>
    <text x="352" y="473" fill="#86efac" font-size="17" font-weight="700">CONTRIBUTOR</text>
    <text x="48" y="508" fill="#fafafa" font-size="23" font-weight="600">Scenery package A</text>
    <text x="352" y="508" fill="#fafafa" font-size="23" font-weight="600">Scenery package B</text>
    <text x="48" y="542" fill="#d4d4d8" font-size="19">Same IDs, adapted positions</text>
    <text x="352" y="542" fill="#d4d4d8" font-size="19">Same IDs, adapted positions</text>
    <text x="28" y="604" fill="#b8b8c2" font-size="18">Workflow diagram. Each contribution matches one scenery.</text>
  </g>
</svg>
