<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc">
  <title id="title">Save an object, then upload changes</title>
  <desc id="desc">Draw or edit, save the object to pending changes, review additions modifications and deletions, then Save and Upload. Wait for Changes Saved. Lead-on links save separately.</desc>
  <rect width="640" height="660" rx="18" fill="#111113"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="28" y="43" fill="#fafafa" font-size="26" font-weight="600">Save an object, then upload changes</text>
    <text x="28" y="77" fill="#b8b8c2" font-size="19">Object edits stay pending until you upload them.</text>
    <rect x="28" y="104" width="584" height="103" rx="10" fill="#232327" stroke="#52525b"/>
    <text x="48" y="150" fill="#fca5a5" font-size="27" font-weight="700">1</text>
    <text x="90" y="142" fill="#fafafa" font-size="25" font-weight="600">Draw or edit</text>
    <text x="90" y="176" fill="#d4d4d8" font-size="19">Check the shape, name, and lighting properties.</text>
    <path d="M69 208 V232 m-7-7 7 7 7-7" fill="none" stroke="#a1a1aa" stroke-width="3"/>
    <rect x="28" y="239" width="584" height="103" rx="10" fill="#232327" stroke="#52525b"/>
    <text x="48" y="285" fill="#fca5a5" font-size="27" font-weight="700">2</text>
    <text x="90" y="277" fill="#fafafa" font-size="25" font-weight="600">Save</text>
    <text x="90" y="310" fill="#d4d4d8" font-size="19">Keeps the object edit in your pending changes.</text>
    <path d="M69 343 V367 m-7-7 7 7 7-7" fill="none" stroke="#a1a1aa" stroke-width="3"/>
    <rect x="28" y="374" width="584" height="103" rx="10" fill="#2c2519" stroke="#8d7040"/>
    <text x="48" y="420" fill="#fcd34d" font-size="27" font-weight="700">3</text>
    <text x="90" y="412" fill="#fafafa" font-size="25" font-weight="600">Review Changes</text>
    <text x="90" y="446" fill="#d4d4d8" font-size="19">Inspect additions, modifications, and deletions.</text>
    <path d="M69 478 V502 m-7-7 7 7 7-7" fill="none" stroke="#a1a1aa" stroke-width="3"/>
    <rect x="28" y="509" width="584" height="103" rx="10" fill="#182b25" stroke="#4b8068"/>
    <text x="48" y="555" fill="#86efac" font-size="27" font-weight="700">4</text>
    <text x="90" y="547" fill="#fafafa" font-size="25" font-weight="600">Save &amp; Upload</text>
    <text x="90" y="581" fill="#d4d4d8" font-size="19">Applies to BARS. Wait for Changes Saved.</text>
    <text x="28" y="644" fill="#b8b8c2" font-size="18">Workflow diagram. Lead-on links save separately.</text>
  </g>
</svg>
